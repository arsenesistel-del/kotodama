<!-- Interface du combat, injectée par la scène Phaser « combat ». Le repaire de la v4 a été retiré en session 10. -->
<canvas id="cv"></canvas>
<div id="ui">
  <section id="hunt" hidden>
    <div class="bars"><i></i><i></i></div>
    <div class="top"><button id="quit" class="quiet">Quitter</button></div>
    <div id="banner" class="banner"></div>
    <!-- Fenêtres du bas, façon vieux Final Fantasy : la créature, la consigne, le sabreur. -->
    <div class="cmd">
      <div class="win foe">
        <span id="mname"></span>
        <div class="hpbar"><div id="mlag"></div><div id="mhp"></div></div>
        <div class="stbar"><span>崩</span><div><i id="stance"></i></div></div>
      </div>
      <div class="win mid">
        <div id="cue" class="cue"></div>
        <div id="fb" class="fb"></div>
        <div id="acts" hidden><button id="void" class="quiet">Le micro a mal entendu</button><button id="skip" class="quiet">Passer</button></div>
        <div class="tb"><div id="tbar"></div></div>
        <div class="under"><div id="heard"></div><div id="readhint" class="readhint" hidden>F ou Espace : lectures</div></div>
      </div>
      <div class="win me">
        <div class="who"><b>渡り</b><span>形</span></div>
        <div id="php"></div>
        <div id="combo"></div>
        <div class="micline"><span id="mic" class="off"></span></div>
      </div>
    </div>
    <!-- Fin d'une rencontre dans les herbes hautes : expérience, butin, ce qui vient d'être acquis. -->
    <div id="eres" class="eres" hidden>
      <b id="etitle"></b>
      <p id="esub"></p>
      <div class="exp"><span id="elv"></span><div class="xpbar"><i id="exp"></i></div><span id="expn"></span></div>
      <p id="eups"></p>
      <p id="eloot"></p>
      <p id="eacq" class="acq"></p>
      <button id="eok" class="primary">続ける · continuer</button>
    </div>
  </section>

  <section id="result" hidden>
    <div class="panel narrow">
      <header><h2 id="rtitle"></h2><p id="rsub"></p></header>
      <div class="rankrow"><div id="rrank" class="rank"></div><div id="rstats" class="rstats"></div></div>
      <p id="rfrag" class="unlock"></p>
      <p id="racq" class="acq"></p>
      <p id="runlock" class="unlock"></p>
      <h3>Phrases à reprendre</h3>
      <ul id="rfails"></ul>
      <footer><span class="btns"><button id="again" class="primary">Rechasser</button><button id="back">村へ戻る · retour au village</button></span></footer>
    </div>
  </section>

  <div id="wipe"></div>
</div>
<input id="dbg" hidden placeholder="mode texte : tape la phrase, puis Entrée" autocomplete="off">
